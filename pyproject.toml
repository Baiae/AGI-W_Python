[project]
name = "vervaeke-agent"
version = "0.1.0"
description = "Vervaeke Agent simulation scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2,<3",
]

[project.optional-dependencies]
viz = [
  "matplotlib>=3.8",
]
dev = [
  "ruff>=0.5",
  "pytest>=8",
  "mypy>=1.10",
]

[project.scripts]
vervaeke-agent = "vervaeke_agent.__main__:main"

[tool.ruff]
line-length = 100

target-version = "py310"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
