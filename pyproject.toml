[project]
name = "vervaeke-agent"
version = "0.1.0"
description = "Vervaeke Agent simulation (persistence, multi-agent, metrics, CLI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5",
]

[project.optional-dependencies]
viz = [
  "matplotlib>=3.8",
]
dev = [
  "ruff>=0.6",
  "pytest>=8.0",
  "mypy>=1.8",
]

[project.scripts]
vervaeke-agent = "vervaeke_agent.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_optional = true
